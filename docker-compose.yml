# The application stack: the API and the SPA that talks to it.
#
#   API_KEY=$(openssl rand -hex 24) POSTGRES_PASSWORD=$(openssl rand -hex 16) \
#     docker compose up --build
#   SPA:  http://localhost:8080   (FRONTEND_PORT to move it)
#   API:  http://localhost:4000/api/health  (BACKEND_PORT to move it)
#
# The monitoring stack (Prometheus + Grafana) stays in `monitoring/docker-compose.yml` and is
# started separately. It scrapes the backend through the published host port, so it works the
# same whether the backend runs here or with `npm run dev`.
#
# API_KEY and POSTGRES_PASSWORD are required and deliberately have no defaults: a stack that
# boots with a known key is an unauthenticated stack, and a database with a known password is
# the same problem one layer down. The backend refuses to start without an API_KEY in
# production anyway, and compose refuses to start at all without a POSTGRES_PASSWORD.

services:
  # The transactional store for the order domain. DuckDB (a file on the backend's volume)
  # stays the analytical store for bars — two engines, each doing what it is good at.
  postgres:
    image: postgres:17-alpine
    container_name: stp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-stp}
    ports:
      # Published for psql and local development. Nothing in the stack needs it — the backend
      # reaches Postgres over the compose network by service name.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone returns true while the server is still doing its initdb restart,
      # which is exactly when a dependent container would connect and fail. The -d flag makes
      # it check the actual database.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-stp} -d ${POSTGRES_DB:-stp}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    image: stp-backend:local
    container_name: stp-backend
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-4000}:4000'
    environment:
      NODE_ENV: production
      PORT: '4000'
      API_KEY: ${API_KEY:?set API_KEY, e.g. API_KEY=$(openssl rand -hex 24) docker compose up}
      # The browser talks to the backend over the published host port, so that — not the
      # service name — is the origin the API must allow.
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-8080}
      DUCKDB_PATH: /app/data/market.duckdb
      LOG_FORMAT: json
      LOG_LEVEL: info
      # One hop: nothing sits in front of the container here, but keep it explicit so the
      # value that matters behind a real balancer is visible in one place.
      TRUST_PROXY: '0'
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-stp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stp}
    volumes:
      - backend-data:/app/data
    depends_on:
      postgres:
        # Not `service_started`: the backend migrates on boot, so it needs a database that
        # accepts connections, not merely a container that exists.
        condition: service_healthy
    # Give the drain in src/lifecycle.js room to finish before Docker escalates to SIGKILL:
    # comfortably above SHUTDOWN_DRAIN_MS + SHUTDOWN_TIMEOUT_MS.
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        # Vite inlines these at build time, so they are build args rather than environment.
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-4000}/api
        VITE_API_KEY: ${API_KEY:?set API_KEY}
    image: stp-frontend:local
    container_name: stp-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
  postgres-data:

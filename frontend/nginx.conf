# Serving a client-routed SPA: every path that is not a real file must return index.html, or
# a browser refresh on /portfolio 404s instead of loading the app.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed asset filenames are immutable, so they can be cached hard. index.html must not be:
  # a stale one pins the browser to a deleted bundle after a deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }

  # The same headers the API sets, for the same reasons — this server hands out the markup
  # and script that talk to it.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
